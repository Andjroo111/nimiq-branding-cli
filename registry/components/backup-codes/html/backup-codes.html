<!-- Nimiq backup-codes: the Keyguard BackupCodesIllustration at the intro step — two
     gradient chat bubbles (purple code 1, red code 2) with white counter circles and
     redacted code lines. Requires backup-codes.css + nimiq-style.min.css. Place on a
     dark card (.nq-blue-bg), 52.5rem wide in Keyguard. Leave the <code> elements empty
     for the placeholder redaction; set their text to show real backup codes (add
     class "complete" and drop "masked" for the confirmed green state). -->
<div class="backup-codes backup-codes-intro">
    <div class="message-bubble code-1 masked">
        <div class="background"></div>
        <div class="label">Nimiq Backup Code 1/2</div>
        <code class="code"></code>
    </div>
    <div class="message-bubble code-2 masked">
        <div class="background"></div>
        <div class="label">Nimiq Backup Code 2/2</div>
        <code class="code"></code>
    </div>
</div>
