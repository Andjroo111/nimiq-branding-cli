<!-- corner-control: the fleet's one-button header corner. Requires
     corner-control.css + connect-wallet-pill (face) + Mulish; Fira Mono for
     the address. ORIGINAL composition, locked with Andrew 2026-07-23; every
     wallet-borrowed piece is verbatim upstream (MobileActionBar, Copyable,
     Settings reference-currency, scan-qr/cashlink/arrow icons).

     Mount + wire (the driver owns every behavior):

         <script type="module">
             import { initCornerControl } from './corner-control.js';
             const wallet = createWallet({ appName: 'My app' });   // nimiq-app-shell seam
             initCornerControl(document.querySelector('.corner-control'), {
                 connect: () => wallet.connect(),                  // HubApi.chooseAddress
                 onDisconnect: () => wallet.disconnect(),
                 onboard: () => hub.onboard(...),                  // create-a-wallet line
                 rename: (label) => hub.rename(...),               // wallet-stored, syncs fleet-wide
                 send: () => hub.checkout(...),                    // Send
                 scan: () => openScanner(),                        // qr-scanner component
                 createCashlink: () => hub.createCashlink(...),    // opt-in row
                 cashlink: true, testnet: false, defaultFiat: 'USD',
                 rates: { USD: 0.000584, ... },                    // app's fiat-rate feed
                 onLanguageChange: (id) => setLocale(id),
             });
         </script>

     Modes (data attributes on the root, stamped by the driver):
       data-state="connected" | (absent = signed out)
       data-mode="miniapp"    -> flag-only face; wallet/cashlink/openpay/
                                 disconnect hidden (window.nimiqPay is ambient)
       data-testnet           -> network row renders (mainnet says nothing)
       data-cashlink          -> opt-in Create-a-Cashlink row
     Every svg id below is instance-unique (rule 3); the driver re-suffixes ids
     whenever it copies a flag into a value row. -->

<div class="corner-control" data-state="connected" data-cashlink>
