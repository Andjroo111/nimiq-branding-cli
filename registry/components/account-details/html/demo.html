<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nimiq AccountDetails — demo</title>
<link rel="stylesheet" href="../../../../assets/css/legacy/nimiq-style.min.css">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="account-details.css">
<style>
    body {
        font-family: 'Mulish', sans-serif;
        margin: 0;
        padding: 32px;
        background: white;
    }

    /* Demo sizing: the panel fills a SmallPage-sized host box */
    .account-details-host {
        width: 420px;
        height: 560px;
    }
</style>
</head>
<body>

<div class="account-details-host">
    <div class="account-details">
        <button class="close-button nq-button-s top-right" aria-label="Close"><svg class="nq-icon" width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M3.528 3.52c4.683-4.684 12.275-4.686 16.96-.005 4.678 4.69 4.678 12.28 0 16.97-4.685 4.68-12.277 4.678-16.96-.005-4.682-4.684-4.682-12.276 0-16.96zm13.145 13.133a1 1 0 0 0 .036-1.374l-3.11-3.11a.25.25 0 0 1 0-.352l3.11-3.11a1 1 0 1 0-1.414-1.415l-3.11 3.11a.25.25 0 0 1-.354 0l-3.11-3.11a1 1 0 0 0-1.41 1.415l3.11 3.11a.249.249 0 0 1 0 .353l-3.11 3.109a1 1 0 0 0 0 1.415c.396.38 1.021.38 1.416 0l3.109-3.11a.252.252 0 0 1 .354 0l3.11 3.11a1 1 0 0 0 1.373-.041z" fill="currentColor"/></svg></button>
        <div class="account column">
            <div class="identicon-and-label">
                <div class="identicon" data-address="NQ33 DH76 PHUK J41Q LX3A U4E0 M0BM QJH9 QQL1">
                    <img src='data:image/svg+xml,<svg width="64" height="64" viewBox="0 -4 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path opacity=".1" d="M62.3 25.4L49.2 2.6A5.3 5.3 0 0 0 44.6 0H18.4c-1.9 0-3.6 1-4.6 2.6L.7 25.4c-1 1.6-1 3.6 0 5.2l13.1 22.8c1 1.6 2.7 2.6 4.6 2.6h26.2c1.9 0 3.6-1 4.6-2.6l13-22.8c1-1.6 1-3.6.1-5.2z" fill="url(%23identicon_radial)"/><defs><radialGradient id="identicon_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="matrix(-63.0033 0 0 -56 63 56)"><stop stop-color="%23260133"/><stop offset="1" stop-color="%231F2348"/></radialGradient></defs></svg>' alt="Nimiq identicon">
                </div>
                <div class="label">Savings Account</div>
                <div class="nq-label wallet-label">Keyguard Wallet</div>
            </div>
            <span class="amount balance">27&#8239;124&#8239;151.41 <span class="currency nim">NIM</span></span>
        </div>
        <div class="copyable address-display format-nimiq" tabindex="0" onclick="accountDetailsCopyAddress(this)">
            <div class="background"></div>
            <span class="chunk">NQ33<span class="space">&nbsp;</span></span><span class="chunk">DH76<span class="space">&nbsp;</span></span><span class="chunk">PHUK<span class="space">&nbsp;</span></span><span class="chunk">J41Q<span class="space">&nbsp;</span></span><span class="chunk">LX3A<span class="space">&nbsp;</span></span><span class="chunk">U4E0<span class="space">&nbsp;</span></span><span class="chunk">M0BM<span class="space">&nbsp;</span></span><span class="chunk">QJH9<span class="space">&nbsp;</span></span><span class="chunk">QQL1<span class="space">&nbsp;</span></span>
            <div class="tooltip">Copied</div>
        </div>
    </div>
</div>

<script>
// Copies the address (minus the tooltip label) and shows the "Copied" tooltip
// for 800ms, like the upstream Copyable component.
function accountDetailsCopyAddress(el) {
    var label = el.querySelector('.tooltip').textContent;
    var text = el.innerText.replace(new RegExp('\\s*' + label + '$'), '').trim();
    if (navigator.clipboard) navigator.clipboard.writeText(text);
    el.classList.add('copied');
    clearTimeout(el._copiedResetTimeout);
    el._copiedResetTimeout = setTimeout(function () { el.classList.remove('copied'); }, 800);
}
</script>

<script type="module">
    import Iqons from 'https://cdn.jsdelivr.net/npm/@nimiq/iqons@1.6.0/dist/iqons.min.js';
    // Identicon sprite: the REAL @nimiq/iqons@1.6.0 iqons.min.svg is vendored at ../../../../assets/img/iqons.min.svg
    // (consumer projects: `nq add` copies it to ./nimiq/assets/img/iqons.min.svg). The iqons LIBRARY import
    // above stays on the jsdelivr pin — it is code, not artwork. The CDN sprite (byte-identical content)
    // is only the fallback when the local copy is unreachable (e.g. file:// contexts that block fetch).
    const localIqonsSprite = '../../../../assets/img/iqons.min.svg';
    const cdnIqonsSprite = 'https://cdn.jsdelivr.net/npm/@nimiq/iqons@1.6.0/dist/iqons.min.svg';
    Iqons.svgPath = await fetch(localIqonsSprite, { method: 'HEAD' }).then((r) => (r.ok ? localIqonsSprite : cdnIqonsSprite)).catch(() => cdnIqonsSprite);

    for (const el of document.querySelectorAll('.account-details .identicon[data-address]')) {
        el.querySelector('img').src = await Iqons.toDataUrl(el.dataset.address);
    }
</script>
</body>
</html>
