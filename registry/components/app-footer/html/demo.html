<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>app-footer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Fira+Mono" rel="stylesheet">
<link rel="stylesheet" href="app-footer.css">
<style>
    html, body { margin: 0; padding: 0; }
    body { font-family: 'Mulish', 'Muli', system-ui, sans-serif; }
    /* app stages the footer sits on: flex column so margin-top:auto pins it.
       The footer itself is transparent chrome; the page supplies the surface.
       Navy surfaces get the bottom-right radial, never a flat fill (rule 7). */
    .stage { min-height: 180px; display: flex; flex-direction: column; background: #F8F8F8; }
    .stage.dark {
        background-color: #1F2348;
        background-image: radial-gradient(100% 100% at bottom right, #260133, #1F2348);
    }
</style>
</head>
<body>
<!-- app-footer: slim "Built on Nimiq" attribution footer for fleet mini apps.
     FIRST instance = the canonical verify target: on-light, all optional slots
     filled (version + dev links). SECOND instance = the on-dark minimal form
     (brand link only) on a navy app surface. Both are the same markup from
     html/app-footer.html; the dark one adds class "on-dark" and drops the
     optional slots. Keep truth/demo/snippet identical. -->

<!-- on-light (grey/white page body): navy ink at 50%, hover full navy -->
<div class="stage">
    <footer class="app-footer">
        <a class="af-brand" href="https://nimiq.com" target="_blank" rel="noopener">
            <span>Built on</span>
            <svg class="af-logo" viewBox="0 0 76 18" role="img" aria-label="Nimiq">
                <path fill="currentColor" d="M19.964 8.156 15.758.844A1.69 1.69 0 0014.299 0H5.887c-.6 0-1.156.32-1.456.844L.225 8.156c-.3.523-.3 1.165 0 1.688l4.206 7.312c.3.523.856.844 1.456.844h8.412c.6 0 1.156-.32 1.456-.844l4.206-7.312a1.69 1.69 0 00.003-1.688"/>
                <path fill="currentColor" d="M34.91 3.656h1.829v10.688H35.33L29.582 6.89v7.453H27.76V3.656h1.403l5.748 7.453zm5.47 10.688V3.656h1.962v10.688zM54.82 3.656h1.543v10.688H54.68v-6.61l-2.874 6.61h-1.262l-2.874-6.61v6.61h-1.683V3.656h1.542l3.646 8.368zm5.189 10.688V3.656h1.962v10.688zm15.075-2.436c-.572 1.14-1.461 1.809-2.25 2.135.093.214.528.81.856 1.153s.673.692 1.11 1.046l-1.332 1.055c-.49-.343-.917-.754-1.351-1.232a9 9 0 01-1.142-1.595 9 9 0 01-.451.014c-1.085 0-1.991-.222-2.773-.663a4.4 4.4 0 01-1.792-1.913c-.379-.756-.623-1.766-.623-2.908s.21-2.076.628-2.908a4.44 4.44 0 011.8-1.913c.783-.444 1.697-.663 2.76-.663s1.991.222 2.773.663a4.4 4.4 0 011.792 1.913c.415.832.623 1.766.623 2.908s-.25 2.154-.628 2.908m-6.935.009q.849 1.02 2.375 1.02 1.528 0 2.375-1.02c.567-.684.85-1.646.85-2.917 0-1.263-.283-2.247-.85-2.922q-.849-1.014-2.375-1.016-1.528 0-2.375 1.007c-.567.673-.85 1.66-.85 2.931s.283 2.233.85 2.917"/>
            </svg>
        </a>
        <span class="af-version">v1.4.2</span>
        <nav class="af-links" aria-label="App links">
            <a href="#">Status</a>
            <a href="#">Source</a>
        </nav>
    </footer>
</div>

<!-- on-dark (navy app): white ink at 50%, hover white; minimal brand-only form -->
<div class="stage dark">
    <footer class="app-footer on-dark">
        <a class="af-brand" href="https://nimiq.com" target="_blank" rel="noopener">
            <span>Built on</span>

</html>
