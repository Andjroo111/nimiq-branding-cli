<style>
    html, body { margin: 0; padding: 0; }
    body { font-family: 'Mulish', 'Muli', system-ui, sans-serif; background: #fff; }
    /* app stages the SLIM footer sits on: flex column so margin-top:auto pins it.
       The slim footer is transparent chrome; the page supplies the surface.
       Navy surfaces get the bottom-right radial, never a flat fill (rule 7). */
    .stage { min-height: 180px; display: flex; flex-direction: column; background: #F8F8F8; }
    .stage.dark {
        background-color: #1F2348;
        background-image: radial-gradient(100% 100% at bottom right, #260133, #1F2348);
    }
</style>

<body>
<!-- app-footer: FEATURED community variant first (full width, sample custom
     app lockup "nimiq.example" with the globe-with-check icon), then the slim
     "Built on Nimiq" variant on a light and a dark app stage. The .af-demo
     wrapper is the canonical verify target, so the reference guards all three
     renders. Markup is identical to html/app-footer.html; keep truth/demo/
     snippet in sync. -->
<div class="af-demo">
