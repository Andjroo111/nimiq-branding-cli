<style>
    body {
        font-family: 'Mulish', sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 3rem;
        background: var(--nimiq-gray);
    }

    /* wallet src/scss/themes.scss global utilities + font-size vars (verbatim) */
    .flex-column { display: flex; flex-direction: column; }
    .flex-row { display: flex; flex-direction: row; }
    :root {
        --body-size: 2rem;
        --small-size: 1.75rem;
    }

    /* Host frame: @nimiq/vue-components SmallPage (flex column, flex-shrink 0)
       + wallet Modal.vue .small-page (margin 0, max-width 100vw) + SwapModal.vue
       override (width 63.5rem, font-size var(--body-size)); Modal min-height
       70.5rem rendered as a fixed representative height */
    .small-page {
        width: 63.5rem; /* 508px */
        max-width: 100vw;
        height: 70.5rem; /* 564px */
        margin: 0;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        font-size: var(--body-size);
    }

    /* SwapModal.vue animation overlay host:
       <div class="page flex-column animation-overlay"><PageBody style="padding: 0.75rem;" class="flex-column"> */
    .animation-overlay { flex-grow: 1; }
    .page-body { flex-grow: 1; overflow-y: auto; }

    /* glyph reference strip (below the verify crop) */
    .swap-glyphs {
        display: flex;
        align-items: center;
        gap: 5rem;
        margin: 4rem 0;
        color: var(--nimiq-blue);
    }
    .swap-glyphs figure { margin: 0; text-align: center; }
    .swap-glyphs svg { display: block; margin: 0 auto; }
    .swap-glyphs figure:first-child svg { width: 12px; height: 16px; }
    .swap-glyphs figcaption { font-size: 1.5rem; font-weight: 600; opacity: 0.6; margin-top: 1rem; }
</style>
</head>

<script type="module">
    import Iqons from 'https://cdn.jsdelivr.net/npm/@nimiq/iqons@1.6.0/dist/iqons.min.js';
    // Identicon sprite: the REAL @nimiq/iqons@1.6.0 iqons.min.svg is vendored at ../../../../assets/img/iqons.min.svg
    // (consumer projects: `nq add` copies it to ./nimiq/assets/img/iqons.min.svg). The iqons LIBRARY import
    // above stays on the jsdelivr pin, it is code, not artwork. The CDN sprite (byte-identical content)
    // is only the fallback when the local copy is unreachable (e.g. file:// contexts that block fetch).
    const localIqonsSprite = '../../../../assets/img/iqons.min.svg';
    const cdnIqonsSprite = 'https://cdn.jsdelivr.net/npm/@nimiq/iqons@1.6.0/dist/iqons.min.svg';
    Iqons.svgPath = await fetch(localIqonsSprite, { method: 'HEAD' }).then((r) => (r.ok ? localIqonsSprite : cdnIqonsSprite)).catch(() => cdnIqonsSprite);

    // Upstream renders a hidden <Identicon> and copies its img src into the
    // puzzle piece's SVG <image>; here we write the data URL straight in.
    const identiconUrl = await Iqons.toDataUrl('NQ00 NIMQ SW4P DEMO SW4P AT0M HTLC DEMO SW4P');
    for (const image of document.querySelectorAll('.swap-animation .identicon image')) {
        image.setAttribute('href', identiconUrl);
    }
</script>
