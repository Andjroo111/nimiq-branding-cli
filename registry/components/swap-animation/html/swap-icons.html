<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimiq swap glyphs</title>
<link rel="stylesheet" href="../../../../assets/css/legacy/nimiq-style.min.css">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Mulish', sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        color: var(--nimiq-blue);
    }

    .swap-glyphs {
        display: flex;
        align-items: center;
        gap: 5rem;
    }

    .swap-glyphs figure { margin: 0; text-align: center; }
    .swap-glyphs svg { display: block; margin: 0 auto; }
    .swap-glyphs figure:first-child svg { width: 12px; height: 16px; }
    .swap-glyphs figcaption { font-size: 1.5rem; font-weight: 600; opacity: 0.6; margin-top: 1rem; }
</style>
</head>
<body>
    <!-- The three wallet swap glyphs at their native sizes, upstream-verbatim:
         upstream/wallet@656ed56 src/components/icons/SwapIcon.vue (12x16),
         SwapSmallIcon.vue (16x16), SwapMediumIcon.vue (24x24).
         Strokes inherit currentColor; paths must never be hand-modified. -->
    <section class="swap-glyphs">
        <figure>
            <svg viewBox="0 0 12 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m4.25 15-3-3 3-3M2.43 11.863h7.071M7.25 1l3 3-3 3M9.07 4.133H1.999"/>
                </g>
            </svg>
            <figcaption>SwapIcon 12x16</figcaption>
        </figure>
        <figure>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9.25 3.25l2 2-2 2" />
                    <path d="M10.25 5.25H7.46a4 4 0 00-2.22.67l-.49.33M6.75 12.75l-2-2 2-2"/>
                    <path d="M5.75 10.75h2.79a4 4 0 002.22-.67l.49-.33"/>
                </g>
            </svg>
            <figcaption>SwapSmallIcon 16x16</figcaption>
        </figure>
        <figure>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M13.75 5.25l3 3-3 3" />
                    <path d="M15.5 8.25h-4.18c-1.19 0-2.34.35-3.33 1l-.74.5M10.25 18.75l-3-3 3-3"/>
                    <path d="M8.5 15.75h4.18c1.19 0 2.34-.35 3.33-1l.74-.5"/>
                </g>
            </svg>
            <figcaption>SwapMediumIcon 24x24</figcaption>
        </figure>
    </section>
</body>
</html>
