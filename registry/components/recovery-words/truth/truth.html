<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RecoveryWords — truth</title>
<link rel="stylesheet" href="../../../../assets/css/legacy/nimiq-style.min.css">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    /* Sample staging: Keyguard shows the filled words on a .page.nq-card.nq-blue-bg card
       (upstream/keyguard src/request/export/index.html #recovery-words, .page max-width
       52.5rem from src/common.css). The stage reproduces the card's blue gradient stage
       at that width; Export.css pulls .recovery-words to the full card width
       (margin: -4rem on the 4rem card-body padding) and insets it 3rem. */
    body { font-family: 'Mulish', sans-serif; margin: 0; padding: 32px; background: white; }
    .card-stage {
        width: 52.5rem; /* 420px */
        color: white;
        background: var(--nimiq-blue);
        background-image: var(--nimiq-blue-bg);
    }
</style>
<style>
    /* RecoveryWords.css — verbatim */
    .recovery-words {
        overflow: hidden scroll;
    }

    .recovery-words .words-container {
        width: 100%;
        box-sizing: border-box;
    }

    .recovery-words .nq-input.shake ,
    .recovery-words .shake {
        border-color: var(--nimiq-red);
    }

    .recovery-words .words-container .word-section {
        display: flex;
        flex-wrap: wrap;
        overflow: hidden; /* prevent scrollbar from showing when input shakes */
    }

    .recovery-words .word {
        margin: .5rem;
        flex: 1 0 25%;
        position: relative;
        height: 5rem;
        line-height: 5rem;
        border-radius: 0.5rem;
    }

    .recovery-words .word.complete {
        background-color: rgba(255, 255, 255, 0.1);
    }

    .recovery-words .word.complete input {
        border-color: rgba(255, 255, 255, 0); /* `transparent` would be black in Safari */
    }

    .recovery-words .word .word-number {
        flex-grow: 0;
        margin: 0 1rem;
        opacity: 0.3;
        font-weight: 600;
        font-size: 1.75rem;
    }

    .recovery-words .word .word-content {
        flex-grow: 1;
        font-size: 2rem;
    }

    .recovery-words input {
        width: 100%;
        text-align: center;
        padding-left: 0.5rem;
        padding-right: 0.5rem;
    }

    .recovery-words input::placeholder {
        font-weight: 600;
    }

    .recovery-words input:focus::placeholder {
        color: transparent;
    }

    .recovery-words input::-webkit-calendar-picker-indicator {
        display: none;
    }

    .recovery-words ::selection {
        background: var(--nimiq-blue); /* WebKit/Blink Browsers */
    }

    .recovery-words ::-moz-selection {
        background: var(--nimiq-blue); /* Gecko Browsers */
    }
</style>
<style>
    /* Export.css geometry, verbatim values with the page id scoping removed and the
       scroll viewport (height 39rem + mask-image) omitted so the full 24-word grid is
       the sample state. */
    .recovery-words {
        position: relative;
        padding: 0 3rem;
        overflow-x: hidden;
    }

    .recovery-words .words-container .word-section {
        padding: 4rem 0rem;
    }

    /* scrollbar hidden for the static full-grid sample (upstream scrolls this area) */
    .recovery-words { scrollbar-width: none; }
    .recovery-words::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div class="card-stage">
    <!-- RecoveryWords display mode (providesInput = false), markup exactly as generated by
         RecoveryWords.js _createElement(): 24 .word.complete.recovery-words-input-field tiles,
         zero-padded .word-number + .word-content. Words: keyguard test fixture mnemonic
         (tests/lib/BitcoinKey.spec.js). -->
    <div class="recovery-words">
        <div class="words-container">
            <div class="word-section">
                <div class="word complete recovery-words-input-field"><span class="word-number">01</span><span class="word-content" title="word #1">rib</span></div>
                <div class="word complete recovery-words-input-field"><span class="word-number">02</span><span class="word-content" title="word #2">dream</span></div>
                <div class="word complete recovery-words-input-field"><span class="word-number">03</span><span class="word-content" title="word #3">attitude</span></div>
                <div class="word complete recovery-words-input-field"><span class="word-number">04</span><span class="word-content" title="word #4">script</span></div>
                <div class="word complete recovery-words-input-field"><span class="word-number">05</span><span class="word-content" title="word #5">click</span></div>
                <div class="word complete recovery-words-input-field"><span class="word-number">06</span><span class="word-content" title="word #6">hope</span></div>
                <div class="word complete recovery-words-input-field"><span class="word-number">07</span><span class="word-content" title="word #7">aisle</span></div>
                <div class="word complete recovery-words-input-field"><span class="word-number">08</span><span class="word-content" title="word #8">orphan</span></div>
                <div class="word complete recovery-words-input-field"><span class="word-number">09</span><span class="word-content" title="word #9">flat</span></div>

                <div class="word complete recovery-words-input-field"><span class="word-number">11</span><span class="word-content" title="word #11">athlete</span></div>
                <div class="word complete recovery-words-input-field"><span class="word-number">12</span><span class="word-content" title="word #12">twelve</span></div>
                <div class="word complete recovery-words-input-field"><span class="word-number">13</span><span class="word-content" title="word #13">toy</span></div>
                <div class="word complete recovery-words-input-field"><span class="word-number">14</span><span class="word-content" title="word #14">sell</span></div>

                <div class="word complete recovery-words-input-field"><span class="word-number">20</span><span class="word-content" title="word #20">common</span></div>
                <div class="word complete recovery-words-input-field"><span class="word-number">21</span><span class="word-content" title="word #21">devote</span></div>
                <div class="word complete recovery-words-input-field"><span class="word-number">22</span><span class="word-content" title="word #22">love</span></div>
                <div class="word complete recovery-words-input-field"><span class="word-number">23</span><span class="word-content" title="word #23">relax</span></div>
                <div class="word complete recovery-words-input-field"><span class="word-number">24</span><span class="word-content" title="word #24">capable</span></div>
            </div>

</div>
</body>
</html>
