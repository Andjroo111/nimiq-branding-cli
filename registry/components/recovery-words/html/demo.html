<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nimiq RecoveryWords</title>
<link rel="stylesheet" href="../../../../assets/css/legacy/nimiq-style.min.css">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="recovery-words.css">
<style>
    /* Stage: Keyguard shows the filled words on a .page.nq-card.nq-blue-bg card
       (52.5rem wide, src/request/export/index.html #recovery-words). */
    body { font-family: 'Mulish', sans-serif; margin: 0; padding: 32px; background: white; }
    .card-stage {
        width: 52.5rem; /* 420px */
        color: white;
        background: var(--nimiq-blue);
        background-image: var(--nimiq-blue-bg);
    }
</style>
</head>
<body>
<div class="card-stage">
    <!-- RecoveryWords display mode (providesInput = false), 24 completed word tiles.
         Words: keyguard test fixture mnemonic (tests/lib/BitcoinKey.spec.js). -->
    <div class="recovery-words">
        <div class="words-container">
            <div class="word-section">
                <div class="word complete recovery-words-input-field"><span class="word-number">01</span><span class="word-content" title="word #1">rib</span></div>
