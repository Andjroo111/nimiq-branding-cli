<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CircleSpinner — truth</title>
<link rel="stylesheet" href="../../../../assets/css/legacy/nimiq-style.min.css">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Mulish', sans-serif; margin: 0; padding: 32px; background: white; }

    /* CircleSpinner.vue scoped styles — verbatim */
    .circle-spinner {
        animation: circle-spinner-spin 1s linear infinite;
    }

    @keyframes circle-spinner-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
    }
</style>
</head>
<body>
    <!-- CircleSpinner: default 18x18, frozen at the rest frame (rotate 0) under disabled animations -->
    <svg class="circle-spinner" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18"   fill="none" stroke-width="2" stroke-linecap="round"><path stroke="#0582CA" d="M9,1c4.42,0,8,3.58,8,8"/><path stroke="#1F2348" opacity=".3" d="M4.27,2.56C2.29,4.01,1,6.35,1,9c0,4.42,3.58,8,8,8c2.65,0,4.99-1.29,6.44-3.27"/></svg>
</body>
</html>
