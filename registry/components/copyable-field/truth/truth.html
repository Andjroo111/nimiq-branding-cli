<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CopyableField — truth</title>
<link rel="stylesheet" href="../../../../assets/css/legacy/nimiq-style.min.css">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Mulish', sans-serif; margin: 0; padding: 32px; background: white; }

    /* Page/demo state: the component renders white text and is meant for dark surfaces,
       so it sits on a navy .nq-blue-bg stage (the class also swaps --nimiq-light-blue
       for its on-dark variant, which colors the 'Copied' notice). */
    .nq-blue-bg {
        width: 60rem;
        padding: 4rem;
        box-sizing: border-box;
    }
</style>
<!-- CopyableField.vue scoped styles, verbatim except for the [data-v-cf] scope attribute,
     which reproduces Vue's scoped compilation. It is load-bearing: the scoped
     .nq-label { color: rgba(255,255,255,.5) } must outweigh nimiq-style's
     .nq-blue-bg .nq-label { color: rgba(255,255,255,.7) } like it does upstream. -->
<style>
    .copyable-field-content[data-v-cf],
    .copy-notice[data-v-cf],
    button[data-v-cf],
    .simple-value .value-container[data-v-cf] {
        transition-duration: .25s;
        transition-timing-function: var(--nimiq-ease);
    }

    .copyable-field[data-v-cf],
    .copyable-field-content[data-v-cf] {
        display: flex;
        width: 100%;
        align-items: center;
    }

    .copyable-field[data-v-cf] {
        flex-direction: column;
        justify-content: space-between;
        color: white;
    }

    .copyable-field-content[data-v-cf] {
        height: 6.25rem;
        position: relative;
        border-radius: 0.5rem;
        line-height: 6.25rem;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.1);
        transition-property: background;
    }

    .small .copyable-field-content[data-v-cf] {
        height: 5rem;
        line-height: 5rem;
    }

    .copy-notice[data-v-cf] {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        font-size: 1.75rem;
        font-weight: 600;
        color: var(--nimiq-light-blue);
        pointer-events: none;
        opacity: 0;
        transition-property: opacity;
    }

    .copyable-field-content[data-v-cf],
    .copy-notice[data-v-cf] {
        padding: 0 3rem;
    }

    .copyable-field-content[data-v-cf]:hover {
        background: rgba(255, 255, 255, 0.16);
    }

    .copied .copy-notice[data-v-cf] {
        opacity: 1;
    }

    button[data-v-cf] {
        margin-left: .5rem;
        transition-property: background, color, opacity;
    }

    button[data-v-cf]:first-of-type {
        margin-left: 2.5rem;
    }

    button[data-v-cf]:not(.inverse) {
        background: transparent;
    }

    button[data-v-cf]:not(.inverse):hover {
        background: rgba(255, 255, 255, .07);
    }

    button.inverse[data-v-cf] {
        color: white;
    }

    button.single-key[data-v-cf] {
        pointer-events: none;
        background: transparent;
    }

    .small button[data-v-cf] {
        height: 3rem;
        line-height: 3rem;
    }

    .copied button[data-v-cf] {
        opacity: 0;
    }

    .value-container[data-v-cf] {
        display: flex;
        align-items: center;
        flex-grow: 1;
        overflow-x: hidden; /* avoid overflow of the value while it's not resized yet */
        white-space: nowrap;
    }

    .simple-value .value-container[data-v-cf] {
        mask-image: linear-gradient(90deg, black 60%, transparent 80%);
        mask-size: 160%;
        transition-property: mask-size;
    }

    .simple-value.copied .value-container[data-v-cf] {
        mask-size: 100%;
    }

    .nq-button-s[data-v-cf],
    .nq-label[data-v-cf] {
        color: rgba(255, 255, 255, 0.5);
    }

    .nq-label[data-v-cf] {
        margin-top: 3rem;
        margin-bottom: 2rem;
    }

    .small .nq-label[data-v-cf] {
        margin-top: 2.75rem;
        margin-bottom: 1.75rem;
    }
</style>
</head>
<body>
    <!-- CopyableField: label 'Address', simple string value (so .simple-value, no key
         buttons), resting (uncopied) state. The value fits the container at the default
         3rem, matching upstream's JS-computed font size (min(3, 3 * scale) = 3). -->
    <div class="nq-blue-bg">
        <div class="copyable-field" data-v-cf>
            <span class="nq-label" data-v-cf>Address</span>
            <div class="copyable-field-content simple-value" data-v-cf>
                <div class="value-container" style="font-size: 3rem" data-v-cf>
                    <span class="value" data-v-cf>NQ07 0000 0000 0000 0000</span>
                </div>
                <div class="copy-notice" data-v-cf>Copied</div>
            </div>
        </div>
    </div>
</body>
</html>
