<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BottomOverlay — upstream truth</title>
<link rel="stylesheet" href="../../../../assets/css/legacy/nimiq-style.min.css">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Mulish', sans-serif; }
</style>

<!-- CloseButton.vue <style scoped>, verbatim modulo the scope attribute: vue-loader
     compiles `button` -> `button[data-v-x]`. The attribute selector is required — it
     lifts specificity to (0,1,1) so these rules beat .nq-button-s (0,1,0). -->
<style>
    button[data-v-close] {
        font-size: 3rem;
        padding: 0;
        background: none !important;
        height: 3rem;
    }

    button[data-v-close]::before {
        border-radius: 50%;
    }

    button .nq-icon[data-v-close] {
        opacity: .2;
        transition: opacity .3s var(--nimiq-ease);
    }

    button:hover .nq-icon[data-v-close],
    button:active .nq-icon[data-v-close],
    button:focus .nq-icon[data-v-close] {
        opacity: .4;
    }

    button.top-right[data-v-close] {
        position: absolute;
        top: 2rem;
        right: 2rem;
    }
</style>

<!-- BottomOverlay.vue <style scoped>, verbatim ('>>>' deep combinator -> descendant) -->
<style>
    .bottom-overlay {
        position: fixed;
        left: 50%;
        bottom: 2rem;
        max-width: 110rem;
        padding: 1.5rem 2rem 1.75rem 2rem;
        border-radius: 1.25rem;
        box-shadow: 0 0 2.5rem rgba(0, 0, 0, 0.111158);
        font-size: 2rem;
        line-height: 1.3;
        transform: translateX(-50%);
    }

    .dark {
        background: var(--nimiq-blue);
        color: white;
    }

    .light {
        background: white;
        color: var(--nimiq-blue);
    }

    .green {
        background: var(--nimiq-green);
        color: white;
    }

    .has-close-button {
        padding-right: 6.5rem;
    }

    .close-button {
        position: absolute;
        top: 1.5rem;
        right: 1.5rem;
    }

    .green .close-button .nq-icon {
        opacity: 0.4;
    }

    .green .close-button:hover .nq-icon,
    .green .close-button:focus .nq-icon {
        opacity: 0.7;
    }

    @media (max-width: 912px) {
        .bottom-overlay {
            bottom: 1.5rem;
            width: calc(100% - 3rem);
        }
    }

    @media (max-width: 450px) {
        .bottom-overlay {
            left: 0;
            bottom: 0;
            width: 100%;
            padding: 2.5rem;
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            transform: none;
        }

        .has-close-button {
            padding-right: 7rem;
        }

        .close-button {
            top: 2rem;
            right: 2rem;
        }
    }
</style>

<!-- Page/demo state: the overlay is position:fixed, so the demo anchors it inside a
     fixed-size stage whose `transform` makes it the containing block for fixed
     descendants — that pins the anchored bottom-center state deterministically for
     the screenshot instead of tying it to the viewport. Viewport is 1000px wide so
     the 912px/450px media queries stay inactive (desktop state). -->
<style>
    body {
        margin: 0;
        padding: 32px;
        background: white;
    }
    .bottom-overlay-stage {
        position: relative;
        width: 720px;
        height: 220px;
        transform: translate(0, 0); /* containing block for the fixed overlay */
        overflow: hidden;
    }
</style>
</head>
<body>

<!-- Upstream template expanded for the sample state:
     theme 'dark' (default), a close listener bound -> hasCloseButton true
     (.has-close-button + CloseButton with .inverse since theme is dark),
     slot text from the upstream storybook sample. -->
<div class="bottom-overlay-stage">
    <div class="bottom-overlay dark has-close-button">
        I'm a BottomOverlay and can contain arbitrary content.
        <button class="close-button nq-button-s inverse" data-v-close aria-label="Close"><svg data-v-close class="nq-icon" width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M3.528 3.52c4.683-4.684 12.275-4.686 16.96-.005 4.678 4.69 4.678 12.28 0 16.97-4.685 4.68-12.277 4.678-16.96-.005-4.682-4.684-4.682-12.276 0-16.96zm13.145 13.133a1 1 0 0 0 .036-1.374l-3.11-3.11a.25.25 0 0 1 0-.352l3.11-3.11a1 1 0 1 0-1.414-1.415l-3.11 3.11a.25.25 0 0 1-.354 0l-3.11-3.11a1 1 0 0 0-1.41 1.415l3.11 3.11a.249.249 0 0 1 0 .353l-3.11 3.109a1 1 0 0 0 0 1.415c.396.38 1.021.38 1.416 0l3.109-3.11a.252.252 0 0 1 .354 0l3.11 3.11a1 1 0 0 0 1.373-.041z" fill="currentColor"/></svg></button>
    </div>
</div>
</body>
</html>
