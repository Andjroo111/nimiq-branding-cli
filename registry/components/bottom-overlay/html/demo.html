<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nimiq BottomOverlay — demo</title>
<link rel="stylesheet" href="../../../../assets/css/legacy/nimiq-style.min.css">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="bottom-overlay.css">
<style>
    body {
        font-family: 'Mulish', sans-serif;
        margin: 0;
        padding: 32px;
        background: white;
    }

    /* Demo stage: the overlay is position:fixed, so the stage's transform makes
       it the containing block for fixed descendants — the bar anchors to the
       stage's bottom center instead of the viewport's. */
    .bottom-overlay-stage {
        position: relative;
        width: 720px;
        height: 220px;
        transform: translate(0, 0);
        overflow: hidden;
    }
</style>
</head>
<body>

<div class="bottom-overlay-stage">
    <div class="bottom-overlay dark has-close-button">
        I'm a BottomOverlay and can contain arbitrary content.
        <button class="close-button nq-button-s inverse" aria-label="Close"
            onclick="this.closest('.bottom-overlay').remove()"><svg class="nq-icon" width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M3.528 3.52c4.683-4.684 12.275-4.686 16.96-.005 4.678 4.69 4.678 12.28 0 16.97-4.685 4.68-12.277 4.678-16.96-.005-4.682-4.684-4.682-12.276 0-16.96zm13.145 13.133a1 1 0 0 0 .036-1.374l-3.11-3.11a.25.25 0 0 1 0-.352l3.11-3.11a1 1 0 1 0-1.414-1.415l-3.11 3.11a.25.25 0 0 1-.354 0l-3.11-3.11a1 1 0 0 0-1.41 1.415l3.11 3.11a.249.249 0 0 1 0 .353l-3.11 3.109a1 1 0 0 0 0 1.415c.396.38 1.021.38 1.416 0l3.109-3.11a.252.252 0 0 1 .354 0l3.11 3.11a1 1 0 0 0 1.373-.041z" fill="currentColor"/></svg></button>
    </div>
</div>
</body>
</html>
