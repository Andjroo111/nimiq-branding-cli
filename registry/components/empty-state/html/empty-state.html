<!-- empty-state: the fleet's quiet nothing-here message. Requires
     empty-state.css; self-contained, no nimiq-style needed.
     Structure (icon, title, message and action all optional, but keep at
     least one line; delete what you don't use):
       .es-icon     a real Nimiq duotone icon (assets/icons/duotone/*.svg)
                    riding currentColor at the muted ink; the CSS sizes it to
                    the 80px spot-illustration scale in the block and a 20px
                    glyph in the row. An emoji still works here (chorecoin
                    legacy) but is not the default. Never a generic icon set.
       .es-title    the primary line: full ink, bold
       .es-message  the secondary line at the muted ink (the row's only line)
       .es-action   at most ONE understated action (the .nq-button-s capsule)
     Classes on .empty-state:
       row      list-level size: one quiet line, small glyph beside the text
       on-dark  white ink ladder for navy surfaces
     No borders, no boxes, no ornament: whitespace + type hierarchy do the work. -->
