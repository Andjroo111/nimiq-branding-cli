<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LanguageSelector — truth</title>
<link rel="stylesheet" href="../../../../assets/css/legacy/nimiq-style.min.css">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    /* Top headroom because the list opens UPWARD (anchored bottom: -2rem), like its
       upstream placement at the bottom of a page. Does not affect the selector crop. */
    body { font-family: 'Mulish', sans-serif; margin: 0; padding: 240px 32px 32px; background: white; }

    /* LanguageSelector.vue scoped styles — verbatim */
    .language-selector {
        contain: layout style; /* no paint because list overflows */
        position: relative;
        width: max-content;
        font-size: 2.25rem;
        font-weight: 600;
        letter-spacing: .125rem;
        text-transform: uppercase;
    }

    .has-arrow::after {
        content: '';
        position: absolute;
        height: 0;
        width: 0;
        border: .5rem solid transparent;
        border-right: .5rem solid var(--arrow-color);
        border-bottom: .5rem solid var(--arrow-color);
        border-radius: .25rem;
        transform: scale(1, 0.8) rotate(135deg);
        transform-origin: 70% 70%;
    }

    .trigger {
        contain: layout paint style;
        padding-right: 2rem;
        outline: none; /* avoid default browser focus style */
    }
    .trigger.has-arrow {
        cursor: pointer;
    }

    .trigger.has-arrow::after {
        --arrow-color: var(--nimiq-blue);
        right: .5rem;
        top: 25%;
        opacity: .3;
        transition: transform .2s var(--nimiq-ease);
    }
    .language-selector:not(:where(:hover, :focus-within, :has(.list))) .trigger.has-arrow::after {
        transform: scale(0.6, 0.9) rotate(45deg);
    }

    .list {
        contain: layout paint style;
        display: flex;
        flex-direction: column;
        position: absolute;
        /*left: -2.25rem;*/
        left: -1rem;
        bottom: -2rem;
        border-radius: .5rem;
        color: white;
        background: var(--nimiq-blue-bg);
        box-shadow: 0 .25rem .3125rem 0 rgba(31, 35, 72, 0.02),
            0 .875rem 1.0625rem 0 rgba(31, 35, 72, 0.04),
            0 2.25rem 4.75rem 0 rgba(31, 35, 72, 0.07);
    }

    .list-entry {
        contain: layout paint style;
        padding: .375rem 1.5rem .375rem 1.5rem;
        outline: none; /* avoid default browser focus style */
        cursor: pointer;
    }
    .list-entry:first-child {
        padding-top: 1.375rem;
    }
    .list-entry:last-child {
        padding-bottom: 1.375rem;
    }

    .list-entry-label {
        position: relative;
        display: inline-block;
        padding-right: 1.375rem;
        opacity: .4;
        transition: opacity .2s var(--nimiq-ease);
    }

    .list-entry-label.has-arrow::after {
        --arrow-color: white;
        top: .75rem;
        right: 0;
        opacity: 0;
        transition: opacity .2s var(--nimiq-ease);
    }
    .list-entry:focus-within .list-entry-label,
    .list-entry:focus-within .list-entry-label.has-arrow::after {
        opacity: 1;
    }

    .transition-fade-enter-active,
    .transition-fade-leave-active {
        transition: opacity .3s var(--nimiq-ease);
    }

    .transition-fade-enter,
    .transition-fade-leave-to {
        opacity: 0 !important;
    }
</style>
</head>
<body>
    <!-- LanguageSelector: closed state, languages [en, de, es, fr, nl, pt], selected 'en'
         (first entry). Closed = list not in the DOM (upstream v-if), so the trigger arrow
         sits in its small closed orientation via the :not(:has(.list)) rule. -->
    <div class="language-selector" tabindex="0">
        <div class="trigger has-arrow">en</div>
    </div>
</body>
</html>
