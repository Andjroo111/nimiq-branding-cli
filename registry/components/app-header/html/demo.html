<title>Nimiq app-header</title>
<!-- Demo: the flagship light bar (custom brand + language selector + wallet
     pill), the navy bar with a testnet badge, the same at 360px, the demoted
     Nimiq-logo fallback, and the language menu open. The stack is the verify
     capture and must stay identical to truth/truth.html. -->

<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">

    body { font-family: 'Mulish', 'Muli', system-ui, sans-serif; padding: 32px; }

    /* Demo chrome (identical in truth/truth.html) */
    .app-header-demo-stack { width: 100%; max-width: 640px; }
    .demo-label { margin: 24px 0 8px; font-size: 12px; font-weight: 600; color: rgba(31, 35, 72, 0.5); }
    .app-header-demo-stack > .demo-label:first-child { margin-top: 0; }
    .demo-mobile { width: 360px; max-width: 100%; }
    .demo-menu-space { height: 210px; }

    /* Live playground chrome (demo only, outside the verify capture) */
    .demo-live { width: 100%; max-width: 640px; margin-top: 24px; }
</style>
</head>
