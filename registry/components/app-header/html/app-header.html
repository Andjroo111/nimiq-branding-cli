<!-- app-header: the fleet's brand bar. Requires app-header.css (+ Mulish);
     the language menu is wired by app-header.js (initLanguageMenu).
     ORIGINAL composition, no upstream equivalent. v2 after Andrew's
     2026-07-10 feedback, modeled on the nimiq.school flagship: every app
     header carries a CUSTOM per-app brand (hexagon-family icon + the app's
     own wordmark, "Nimiq.school" style), the built-in language selector, and
     optionally a network badge + the connect-wallet-pill.

     Slots:
       .app-header-brand  custom icon + app name (the default brand mode),
                          OR the fallback horizontal-white Nimiq logo (below).
       .app-header-tools  badge, language selector, connect-wallet-pill
                          (nq add connect-wallet-pill). Remove the whole tools
                          div and the brand centers itself (the tipjar layout).

     Surfaces: this snippet shows the light bar (.app-header--light, the
     nimiq.school look; works sticky). Drop the modifier for the navy radial
     bar. Every svg id on the page must stay unique (rule 3): suffix the
     gradient/clipPath ids per instance. -->

<header class="app-header app-header--light">
    <a class="app-header-brand" href="/" aria-label="Nimiq.yourapp">
        <!-- Your app's own hexagon-family icon, drawn in currentColor so it
             reads navy on light and white on navy. The universal hexagon
             below is the starting point (anyone may build on it); nimiq.school
             builds the globe-with-check on it (see the demo). Never place any
             icon next to the horizontal Nimiq logo (rule 4). -->
        <svg class="app-header-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 18" aria-hidden="true">
            <g fill="none">
                <path fill="url(#nq-app-header-hex-grad)"
                    d="M19.964 8.156 15.758.844A1.69 1.69 0 0014.299 0H5.887c-.6 0-1.156.32-1.456.844L.225 8.156c-.3.523-.3 1.165 0 1.688l4.206 7.312c.3.523.856.844 1.456.844h8.412c.6 0 1.156-.32 1.456-.844l4.206-7.312a1.69 1.69 0 00.003-1.688"/>
                <defs>
                    <radialGradient id="nq-app-header-hex-grad" cx="0" cy="0" r="1"
                        gradientTransform="matrix(20.1956 0 0 20.2552 15.188 17.766)"
                        gradientUnits="userSpaceOnUse">
                        <stop stop-color="#ec991c"/>
                        <stop offset="1" stop-color="#e9b213"/>
                    </radialGradient>
                </defs>
            </g>
        </svg>
        <span class="app-header-name">Nimiq.yourapp</span>
    </a>
    <div class="app-header-tools">
        <span class="app-header-badge">Testnet</span>

        <!-- Language selector (the nimiq.school NavBar pattern): the button
             shows ONLY the current language's flag-hex + a small caret; the
             list pairs each flag with the language's native name. Flags are
             vendored artwork per the flag-hex precedent: inline the flag
             drawing (below) or point an <image href> at your vendored
             flag-icons file — never a flag CDN. Localize the aria-labels. -->
        <div class="app-header-lang">
            <button type="button" class="app-header-lang-btn" aria-label="Language"
                aria-haspopup="listbox" aria-expanded="false">
                <span class="app-header-lang-flag">
                    <svg viewBox="0 0 20 18" aria-hidden="true">
                        <defs><clipPath id="fh-yourapp-de-t"><path d="M19.964 8.156 15.758.844A1.69 1.69 0 0014.299 0H5.887c-.6 0-1.156.32-1.456.844L.225 8.156c-.3.523-.3 1.165 0 1.688l4.206 7.312c.3.523.856.844 1.456.844h8.412c.6 0 1.156-.32 1.456-.844l4.206-7.312a1.69 1.69 0 00.003-1.688"/></clipPath></defs>
                        <g clip-path="url(#fh-yourapp-de-t)">
                            <rect x="-1" y="-1.8" width="21.6" height="7.2" fill="#000"/>
                            <rect x="-1" y="5.4" width="21.6" height="7.2" fill="#d00"/>
                            <rect x="-1" y="12.6" width="21.6" height="7.2" fill="#ffce00"/>
                        </g>
                        <path class="fh-edge" d="M19.964 8.156 15.758.844A1.69 1.69 0 0014.299 0H5.887c-.6 0-1.156.32-1.456.844L.225 8.156c-.3.523-.3 1.165 0 1.688l4.206 7.312c.3.523.856.844 1.456.844h8.412c.6 0 1.156-.32 1.456-.844l4.206-7.312a1.69 1.69 0 00.003-1.688"/>
                    </svg>
                </span>
                <svg class="app-header-lang-caret" viewBox="0 0 10 6" aria-hidden="true">
                    <path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <ul class="app-header-lang-list" role="listbox" aria-label="Language" hidden>
                <li>
                    <button type="button" class="app-header-lang-option current" role="option"
                        aria-selected="true" data-lang="de">
                        <span class="app-header-lang-flag">
                            <svg viewBox="0 0 20 18" aria-hidden="true">
                                <defs><clipPath id="fh-yourapp-de"><path d="M19.964 8.156 15.758.844A1.69 1.69 0 0014.299 0H5.887c-.6 0-1.156.32-1.456.844L.225 8.156c-.3.523-.3 1.165 0 1.688l4.206 7.312c.3.523.856.844 1.456.844h8.412c.6 0 1.156-.32 1.456-.844l4.206-7.312a1.69 1.69 0 00.003-1.688"/></clipPath></defs>
                                <g clip-path="url(#fh-yourapp-de)">
                                    <rect x="-1" y="-1.8" width="21.6" height="7.2" fill="#000"/>
                                    <rect x="-1" y="5.4" width="21.6" height="7.2" fill="#d00"/>
                                    <rect x="-1" y="12.6" width="21.6" height="7.2" fill="#ffce00"/>
                                </g>
                                <path class="fh-edge" d="M19.964 8.156 15.758.844A1.69 1.69 0 0014.299 0H5.887c-.6 0-1.156.32-1.456.844L.225 8.156c-.3.523-.3 1.165 0 1.688l4.206 7.312c.3.523.856.844 1.456.844h8.412c.6 0 1.156-.32 1.456-.844l4.206-7.312a1.69 1.69 0 00.003-1.688"/>
                            </svg>
                        </span>
                        Deutsch
                    </button>
                </li>
                <li>
                    <button type="button" class="app-header-lang-option" role="option"
                        aria-selected="false" data-lang="fr">
                        <span class="app-header-lang-flag">
                            <svg viewBox="0 0 20 18" aria-hidden="true">
                                <defs><clipPath id="fh-yourapp-fr"><path d="M19.964 8.156 15.758.844A1.69 1.69 0 0014.299 0H5.887c-.6 0-1.156.32-1.456.844L.225 8.156c-.3.523-.3 1.165 0 1.688l4.206 7.312c.3.523.856.844 1.456.844h8.412c.6 0 1.156-.32 1.456-.844l4.206-7.312a1.69 1.69 0 00.003-1.688"/></clipPath></defs>
                                <g clip-path="url(#fh-yourapp-fr)">
                                    <rect x="-1" y="-1.8" width="7.2" height="21.6" fill="#002395"/>
                                    <rect x="6.2" y="-1.8" width="7.2" height="21.6" fill="#fff"/>
                                    <rect x="13.4" y="-1.8" width="7.2" height="21.6" fill="#ed2939"/>
                                </g>
                                <path class="fh-edge" d="M19.964 8.156 15.758.844A1.69 1.69 0 0014.299 0H5.887c-.6 0-1.156.32-1.456.844L.225 8.156c-.3.523-.3 1.165 0 1.688l4.206 7.312c.3.523.856.844 1.456.844h8.412c.6 0 1.156-.32 1.456-.844l4.206-7.312a1.69 1.69 0 00.003-1.688"/>
                            </svg>
                        </span>
                        Français
                    </button>
                </li>
            </ul>
        </div>

        <!-- connect-wallet-pill mounts here (class on-dark on the navy bar):
             <button type="button" class="connect-wallet-pill" data-state="connect">
                 <span class="cwp-label">Connect wallet</span>
             </button> -->
    </div>
</header>

<!-- Wire the language menu (open/close, selection, trigger flag swap):
    <script type="module">
        import { initLanguageMenu } from './app-header.js';
        initLanguageMenu(document.querySelector('.app-header-lang'), {
            onChange: (id) => setLanguage(id),
        });
    </script>
-->

     horizontal-white Nimiq logo on the navy bar. It already contains the
     hexagon — never place another icon next to it (rule 4). The signet +
     wordmark combination is reserved and must not be altered.

    <header class="app-header">
        <a class="app-header-brand" href="/" aria-label="Nimiq">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 18" height="22" aria-hidden="true">
                <g fill="none">
                    <path fill="url(#nq-app-header-logo-grad)"

                    <path fill="#fff"

                    <defs>
                        <radialGradient id="nq-app-header-logo-grad" cx="0" cy="0" r="1"

                            <stop offset="1" stop-color="#e9b213"/>
                        </radialGradient>
                    </defs>
                </g>
            </svg>
        </a>
    </header>
