<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>app-header truth</title>
<!-- ORIGINAL composition truth (flag-hex precedent): there is no upstream
     Nimiq app header to render, so this canonical composition IS the
     reference. reference.png is snapped from this file and nq verify guards
     the demo against it as a regression check.
     Sources composed here: the tipjar brand bar (apps/tipjar public/index.html
     .header: verbatim horizontal-white logo on the navy radial, 16px 20px),
     the splitlink hexagon + wordmark header (formalized on the VERBATIM
     hexagon path), the wallet's testnet treatment (upstream/wallet
     Sidebar.vue .testnet-notice: orange label on white .07), and the
     connect-wallet-pill component for the tools cluster. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../assets/css/legacy/nimiq-style.min.css">
<link rel="stylesheet" href="../html/app-header.css">

    html, body { margin: 0; padding: 0; background: #F8F8F8; }
    body { font-family: 'Mulish', 'Muli', system-ui, sans-serif; padding: 32px; }

    /* Demo chrome (identical in html/demo.html) */
    .app-header-demo-stack { width: 100%; max-width: 640px; }
    .demo-label { margin: 24px 0 8px; font-size: 12px; font-weight: 600; color: rgba(31, 35, 72, 0.5); }
    .app-header-demo-stack > .demo-label:first-child { margin-top: 0; }
    .demo-mobile { width: 360px; max-width: 100%; }
</style>
</head>
