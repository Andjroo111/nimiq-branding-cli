<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QrScanner — upstream truth</title>
<link rel="stylesheet" href="../../../../assets/css/legacy/nimiq-style.min.css">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Mulish', sans-serif; }
</style>

<!-- QrScanner.vue <style scoped>, verbatim. The .cancel-button rules keep the
     vue-loader scope attribute ([data-v-scanner]): it lifts their specificity to
     (0,2,0)/(0,3,0) so they beat nimiq-style's .nq-button-s.inverse rules by source
     order, exactly like the runtime scoped CSS. The browser-instruction rules
     (.browser-menu-icon etc.) are omitted — they belong to states that depend on
     live browser detection, unreachable in this static sample. -->
<style>
    .qr-scanner {
        position: relative;
        overflow: hidden;
    }

    .fade-enter,
    .fade-leave-to {
        opacity: 0;
        transition: .7s;
    }

    .fade-leave,
    .fade-enter-to {
        opacity: 1;
        transition: .7s;
    }

    video {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 100%;
        object-fit: cover;
        display: block;
        opacity: 0;
        transition: opacity .3s;
    }

    video.ready {
        opacity: 1;
    }

    .overlay {
        position: absolute;
    }

    .overlay:not(.inactive) {
        animation: overlay-animation 400ms infinite alternate ease-in-out;
    }

    @keyframes overlay-animation {
        from {
            transform: scale(.98);
        }
        to {
            transform: scale(1.01);
        }
    }

    .overlay svg {
        width: 100%;
        height: 100%;
        stroke: var(--nimiq-gold);
    }

    .overlay.inactive svg {
        stroke: rgba(255, 255, 255, .4);
    }

    .cancel-button[data-v-scanner] {
        background: white;
        position: absolute;
        bottom: 3rem;
        left: 50%;
        transform: translateX(-50%);
        color: var(--nimiq-blue);
    }

    .cancel-button[data-v-scanner]:hover,
    .cancel-button[data-v-scanner]:focus,
    .cancel-button[data-v-scanner]:active {
        background: #EFF0F2; /* Indigo 7% */
    }

    .camera-access-failed {
        color: white;
        text-align: center;
        font-size: 2rem;
    }

    .camera-access-failed-warning {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 30rem;
        max-width: 80%;
        font-weight: bold;
    }

    .access-denied-instructions {
        opacity: .7;
        position: absolute;
        left: 50%;
        bottom: 9rem;
        width: calc(100% - 4rem);
        transform: translateX(-50%);
        line-height: 1.7;
        white-space: pre-line;
    }
</style>

<!-- Page/demo state: scanner mounted in a 300x300 box (the storybook mounts it
     with height 100% inside a SmallPage) -->
<style>
    body {
        margin: 0;
        padding: 32px;
        background: white;
    }
    .qr-scanner {
        width: 300px;
        height: 300px;
    }
</style>
</head>
<body>

<!-- Upstream template expanded for the sample state: the inactive/idle shell.
     No camera is reachable (as in any headless or permission-less context), so
     cameraAccessFailed = true and hasCamera = false: the video never gets .ready
     (stays at opacity 0, showing the nq-blue radial gradient), the corner-frame
     overlay carries .inactive (white 40% stroke, no pulse animation) and the
     camera-access-failed warning shows. The overlay geometry is JS-measured by
     repositionOverlay(): size = ceil(2/3 * min(width, height)) = 200px, centered
     -> top/left = (300 - 200) / 2 = 50px, written into element.style. -->
<div class="qr-scanner nq-blue-bg">
    <video muted autoplay playsinline width="600" height="600"></video>
    <div class="overlay inactive" style="width: 200px; height: 200px; top: 50px; left: 50px;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 238">
            <path fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M31.3 2H10a8 8 0 0 0-8 8v21.3M206.8 2H228a8 8 0 0 1 8 8v21.3m0 175.4V228a8 8 0 0 1-8 8h-21.3m-175.4 0H10a8 8 0 0 1-8-8v-21.3"/>
        </svg>
    </div>
    <button class="nq-button-s inverse cancel-button" data-v-scanner>Cancel</button>

    <div class="camera-access-failed">
        <div class="camera-access-failed-warning">
            Your device does not have an accessible camera.
        </div>
    </div>
</div>
</body>
</html>
